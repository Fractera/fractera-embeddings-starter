# The element's own check on three systems (node step 626-2). The pinned model from this repository's release, counted by
# onnxruntime-node 1.21.0 on Linux x64, macOS arm64 and Windows x64, must give the vectors of the 626-1 reference counted on the
# owner's Intel Mac: the vectors Fractera ships ready (step 627) equal a node's own only while this stays green.
# The template's three-os.yml (the build with every guard) stands beside it and is rolled out by the template; this file is the
# element's own.
name: embeddings-three-os

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  vectors:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # each system answers for itself: a difference between the columns is the answer
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencies — onnxruntime-node brings its binary for this system (no CUDA download, .npmrc)
        run: npm ci

      - name: The pinned model from this repository's release, size and sha256 checked
        run: npm run model

      - name: The doors' samples — the same vectors as the 626-1 reference, refusals, the status
        run: |
          npm run test:embed
          npm run test:embed-status
